name: Windows iPhone trial IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Pinned to match upstream ci.yml so a runner image update can't swap the SDK
      # underneath a build that upstream CI has already proven compiles.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      META_APP_ID: ${{ secrets.OPENVISION_META_APP_ID }}
      META_CLIENT_TOKEN: ${{ secrets.OPENVISION_META_CLIENT_TOKEN }}
      # Team ID of the Apple account that signs the IPA (Sideloadly shows it as the bundle ID
      # suffix). Info.plist copies it into MWDAT.TeamID, and the Meta SDK rejects registration
      # with "configuration is invalid or incomplete" when it is empty.
      APPLE_TEAM_ID: ${{ vars.OPENVISION_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Meta configuration
        shell: bash
        run: |
          if [[ -z "$APPLE_TEAM_ID" ]]; then
            echo "::error::Set the OPENVISION_APPLE_TEAM_ID repository variable before running."
            exit 1
          fi
          if [[ -z "$META_APP_ID" || -z "$META_CLIENT_TOKEN" ]]; then
            echo "::error::Configure OPENVISION_META_APP_ID and OPENVISION_META_CLIENT_TOKEN as GitHub Actions secrets before running."
            exit 1
          fi
          if [[ "$META_CLIENT_TOKEN" != "AR|$META_APP_ID|"* ]]; then
            echo "::error::Client token must be the full AR|APP_ID|TOKEN value."
            exit 1
          fi
      - name: Create ignored configuration files
        shell: bash
        run: |
          cp OpenVision/Config/Config.swift.example OpenVision/Config/Config.swift
          {
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "PRODUCT_BUNDLE_IDENTIFIER = com.sman007.openvisiontrial"
            echo "META_APP_ID = $META_APP_ID"
            echo "CLIENT_TOKEN = $META_CLIENT_TOKEN"
            echo "APP_LINK_URL_SCHEME = openvision"
          } > Config.xcconfig
          chmod 600 Config.xcconfig
      - name: Cache Swift packages
        # Package.resolved is gitignored, so key on the files that hold the pins, exactly as
        # upstream ci.yml does. The MLX, Kokoro and Meta DAT checkouts are the slow part of a
        # cold build and this job has a 90-minute ceiling.
        uses: actions/cache@v6
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('OpenVision.xcodeproj/project.pbxproj', 'project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Install toolchain dependencies
        # No xcodegen: project.pbxproj and the shared OpenVision scheme are both committed,
        # and upstream CI builds them directly. Regenerating would rewrite the very project
        # and scheme that upstream CI has already proven compiles.
        # The Metal toolchain is a separately downloadable Xcode component; this job builds
        # Release, where mlx-swift's Metal shaders are compiled, so fetch it up front.
        run: |
          brew install xcbeautify
          xcodebuild -downloadComponent MetalToolchain
      - name: Show toolchain
        # The pinned DEVELOPER_DIR above is an assumption about the runner image. Print what
        # actually resolved so a toolchain mismatch is visible here instead of surfacing as a
        # confusing compile error later.
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build unsigned iPhone application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            | xcbeautify --renderer github-actions
      - name: Package unsigned IPA for local Windows signing
        shell: bash
        run: |
          mkdir -p Payload dist
          cp -R DerivedData/Build/Products/Release-iphoneos/OpenVision.app Payload/
          # With signing disabled the binary carries no entitlements, so Sideloadly had nothing
          # to request and dropped increased-memory-limit; iOS then killed the app (jetsam
          # per-process-limit) while loading SmolVLM2. An ad-hoc signature embeds the
          # entitlements for Sideloadly to read. Frameworks first: a bundle cannot be sealed
          # over unsigned nested code.
          find Payload/OpenVision.app/Frameworks -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
            -exec codesign --force --sign - --timestamp=none {} \;
          codesign --force --sign - --timestamp=none \
            --entitlements OpenVision/OpenVision.entitlements Payload/OpenVision.app
          codesign -d --entitlements - Payload/OpenVision.app | grep -q increased-memory-limit
          zip -qr dist/OpenVision-unsigned.ipa Payload
          # Hash from inside dist/ so the checksum file names the IPA alone. With a "dist/"
          # prefix, `shasum -c SHA256SUMS.txt` fails after the artifact is extracted on
          # Windows unless the directory layout is recreated by hand.
          ( cd dist && shasum -a 256 OpenVision-unsigned.ipa > SHA256SUMS.txt )
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: openvision-unsigned-iphone
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Delete temporary injected credentials
        if: always()
        run: rm -f Config.xcconfig OpenVision/Config/Config.swift
