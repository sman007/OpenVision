name: Windows iPhone trial IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      META_APP_ID: ${{ secrets.OPENVISION_META_APP_ID }}
      META_CLIENT_TOKEN: ${{ secrets.OPENVISION_META_CLIENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Meta configuration
        shell: bash
        run: |
          if [[ -z "$META_APP_ID" || -z "$META_CLIENT_TOKEN" ]]; then
            echo "::error::Configure OPENVISION_META_APP_ID and OPENVISION_META_CLIENT_TOKEN as GitHub Actions secrets before running."
            exit 1
          fi
          if [[ "$META_CLIENT_TOKEN" != "AR|$META_APP_ID|"* ]]; then
            echo "::error::Client token must be the full AR|APP_ID|TOKEN value."
            exit 1
          fi
      - name: Create ignored configuration files
        shell: bash
        run: |
          cp OpenVision/Config/Config.swift.example OpenVision/Config/Config.swift
          {
            echo "DEVELOPMENT_TEAM ="
            echo "PRODUCT_BUNDLE_IDENTIFIER = com.sman007.openvisiontrial"
            echo "META_APP_ID = $META_APP_ID"
            echo "CLIENT_TOKEN = $META_CLIENT_TOKEN"
            echo "APP_LINK_URL_SCHEME = openvision"
          } > Config.xcconfig
          chmod 600 Config.xcconfig
      - name: Install toolchain dependencies
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -downloadComponent MetalToolchain
          xcodegen generate
      - name: Build unsigned iPhone application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project OpenVision.xcodeproj \
            -scheme OpenVision \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
      - name: Package unsigned IPA for local Windows signing
        shell: bash
        run: |
          mkdir -p Payload dist
          cp -R DerivedData/Build/Products/Release-iphoneos/OpenVision.app Payload/
          zip -qr dist/OpenVision-unsigned.ipa Payload
          shasum -a 256 dist/OpenVision-unsigned.ipa > dist/SHA256SUMS.txt
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: openvision-unsigned-iphone
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Delete temporary injected credentials
        if: always()
        run: rm -f Config.xcconfig OpenVision/Config/Config.swift
